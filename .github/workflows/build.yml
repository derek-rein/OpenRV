# Multi-platform Release builds for Windows, macOS ARM, and Linux.
# Uses prebuilt Qt via jurplel/install-qt-action (aqt) with Actions cache.
#
# Triggers (NEVER on PR / feature-branch push — those are approve-then-build):
#   1. push of tag v*         — human/PAT tag push → build + GitHub Release
#   2. workflow_dispatch      — Auto-tag release after merge to main
#                               (GITHUB_TOKEN tag pushes do NOT start workflows)
#
# Release flow (mirrors exr-converter):
#   version bump PR → light PR Check only → merge → Auto-tag → this workflow
#   → GitHub Release with stable asset names
#
# Manual packaging smoke test (no PR noise): Actions → Multi-platform Build → Run
# with empty tag (artifacts only) or a tag input (publish).
#
# Stable download URLs (do not put the version in the filename):
#   https://github.com/<owner>/<repo>/releases/latest/download/openrv-linux-x86_64.tar.gz
#   https://github.com/<owner>/<repo>/releases/latest/download/openrv-macos-arm64.dmg
#   https://github.com/<owner>/<repo>/releases/latest/download/openrv-windows-x86_64-setup.exe
# Raw install trees are also uploaded (tar.gz / zip) next to the DMG and installer.
#
# Point versions: tags are plain semver, e.g. v4.0.2. The tag is the published
# version; CMakeLists.txt is patched for that build so the binary reports it.

name: Multi-platform Build

on:
  workflow_dispatch:
    inputs:
      skip_deps_cache:
        description: 'Skip dependencies caching'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      platforms:
        description: 'Which platforms to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
      tag:
        description: 'Release tag (e.g. v4.0.2). Empty = CI artifacts only, no GitHub Release.'
        required: false
        type: string
        default: ''
      source_ref:
        description: 'Git ref to build (default: same as tag when set, else the branch selected in the UI).'
        required: false
        type: string
        default: ''
      wait_for_notarization:
        description: 'Wait for notarization on the macOS runner (default off; burns macOS minutes)'
        required: false
        default: false
        type: boolean

  # Builds run only on push to main (plus manual / auto-tag dispatch).
  # No PR, tag or other-branch triggers.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

concurrency:
  group: multi-platform-build-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  # Published version / GitHub Release name (empty when CI-only)
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
  # Code to build: prefer explicit source_ref, else the tag, else the event ref
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref != '' && inputs.source_ref || (inputs.tag != '' && inputs.tag || github.ref_name)) || github.ref_name }}
  # Stable asset basenames (no version — required for /releases/latest/download/)
  ARTIFACT_LINUX: openrv-linux-x86_64
  ARTIFACT_MACOS: openrv-macos-arm64
  ARTIFACT_WINDOWS: openrv-windows-x86_64

jobs:
  # ── Resolve whether this run publishes a GitHub Release ───────────────────
  meta:
    name: Resolve release meta
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.resolve.outputs.release_version }}
      publish_release: ${{ steps.resolve.outputs.publish_release }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
    steps:
      - name: Resolve tag / version
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ env.RELEASE_TAG }}"
          REF="${{ env.RELEASE_REF }}"
          if [ -n "$TAG" ]; then
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: tag must be vX.Y.Z (got: ${TAG})" >&2
              exit 1
            fi
            VERSION="${TAG#v}"
            {
              echo "publish_release=true"
              echo "release_tag=${TAG}"
              echo "release_version=${VERSION}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "publish_release=false"
              echo "release_tag="
              echo "release_version="
            } >> "$GITHUB_OUTPUT"
          fi
          echo "release_ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-none} version=${VERSION:-n/a} ref=${REF} publish=${TAG:+true}${TAG:-false}"

  linux:
    needs: meta
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'linux'
    name: 'Linux Rocky 9 CY2025 Release'
    runs-on: ubuntu-latest
    container:
      image: amd64/rockylinux:9
      volumes:
        - /usr/local/lib/android:/github/home/android
        - /usr/share/dotnet:/github/home/dotnet
        - /opt/ghc:/github/home/ghc
        - /usr/local/.ghcup:/github/home/.ghcup
        - /usr/local/graalvm:/github/home/graalvm
        - /usr/local/share/powershell:/github/home/powershell
        - /usr/local/share/chromium:/github/home/chromium
        - /usr/local/lib/node_modules:/github/home/node_modules
        - /opt/hostedtoolcache:/github/home/hostedtoolcache
        - /usr/local/share/boost:/github/home/boost
        - /usr/share/swift:/github/home/swift
        - /usr/share/miniconda:/github/home/miniconda
        - /usr/local/share/vcpkg:/github/home/vcpkg
        - /home/runner/.cargo:/github/home/.cargo
        - /home/runner/.rustup:/github/home/.rustup
    steps:
      - name: Install git and python3
        run: dnf install -y git python3
        shell: bash

      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ needs.meta.outputs.release_ref }}
          submodules: recursive

      - name: Apply point version from release tag
        if: needs.meta.outputs.publish_release == 'true'
        shell: bash
        run: python3 scripts/apply_release_version.py "${{ needs.meta.outputs.release_version }}"

      - uses: ./.github/actions/build-linux
        with:
          rocky-version: '9'
          build-type: 'Release'
          qt-version: '6.5.3'
          cmake-version: '3.31.6'
          python-version: '3.11.8'
          vfx-platform: 'CY2025'
          extra_repo: 'crb'
          cache-qt: 'true'
          # Lean Qt set: only modules OpenRV links (skips debug_info + unused kits).
          rocky_qt6_modules: 'qt5compat qtimageformats qtmultimedia qtpositioning qtwebchannel qtwebengine qtwebsockets'
          braw-sdk-read-token: ${{ secrets.BRAW_SDK_READ_TOKEN }}
          r3d-sdk-read-token: ${{ secrets.R3D_SDK_READ_TOKEN }}

      - name: Package install tree
        run: |
          tar -czf "${{ env.ARTIFACT_LINUX }}.tar.gz" -C _install .
          ls -lh "${{ env.ARTIFACT_LINUX }}.tar.gz"
        shell: bash

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_LINUX }}
          path: ${{ env.ARTIFACT_LINUX }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos-arm:
    needs: meta
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'macos'
    name: 'macOS ARM64 CY2025 Release'
    runs-on: macos-15
    # The compile can take a few hours. Notarization is submitted and then
    # left for notarize-finish.yml, so this window is only for the build
    # (unless wait_for_notarization is turned on). 360 is the hosted cap.
    timeout-minutes: 360
    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ needs.meta.outputs.release_ref }}
          submodules: recursive

      - name: Apply point version from release tag
        if: needs.meta.outputs.publish_release == 'true'
        shell: bash
        run: python3 scripts/apply_release_version.py "${{ needs.meta.outputs.release_version }}"

      - uses: ./.github/actions/build-macos
        with:
          arch-type: 'arm64'
          build-type: 'Release'
          qt-version: '6.5.3'
          qt-version-short: '6.5'
          python-version: '3.11'
          cmake-version: '3.31.6'
          vfx-platform: 'CY2025'
          skip_deps_cache: ${{ inputs.skip_deps_cache || 'false' }}
          cache-qt: 'true'
          # Lean Qt set: only modules OpenRV links (skips debug_info + unused kits).
          # Qt 6 clang_64 is universal arm64+x86_64 prebuilt — no source build.
          macos_qt6_modules: 'qt5compat qtimageformats qtmultimedia qtpositioning qtwebchannel qtwebengine qtwebsockets'
          braw-sdk-read-token: ${{ secrets.BRAW_SDK_READ_TOKEN }}
          r3d-sdk-read-token: ${{ secrets.R3D_SDK_READ_TOKEN }}

      # Unsigned app first, so a signing failure can be retried with
      # macos-sign.yml (sign_from_run_id) instead of a multi-hour rebuild.
      # tar keeps the framework symlinks that upload-artifact would flatten.
      - name: Archive unsigned RV.app
        shell: bash
        run: |
          tar -czf "${{ env.ARTIFACT_MACOS }}-unsigned.tar.gz" -C _install .
          ls -lh "${{ env.ARTIFACT_MACOS }}-unsigned.tar.gz"

      - name: Upload unsigned RV.app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_MACOS }}-unsigned
          path: ${{ env.ARTIFACT_MACOS }}-unsigned.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Sign, build DMG, and submit for notarization
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          DMG_NAME: ${{ env.ARTIFACT_MACOS }}.dmg
          # Default off. Opt in only for a one-off that should poll on macOS.
          WAIT_FOR_NOTARIZATION: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_for_notarization && 'true' || 'false' }}
        run: |
          chmod +x scripts/macos/sign_and_notarize.sh
          scripts/macos/sign_and_notarize.sh "${GITHUB_WORKSPACE}/_install" "${GITHUB_WORKSPACE}/dist"
          tar -czf "${{ env.ARTIFACT_MACOS }}.tar.gz" -C _install .
          ls -lh "dist/${{ env.ARTIFACT_MACOS }}.dmg" "${{ env.ARTIFACT_MACOS }}.tar.gz" dist/notarize-pending.json || true

      - name: Upload macOS ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_MACOS }}
          path: |
            dist/${{ env.ARTIFACT_MACOS }}.dmg
            ${{ env.ARTIFACT_MACOS }}.tar.gz
            dist/notarize-pending.json
          if-no-files-found: error
          retention-days: 14

      - name: Queue notarization for the Ubuntu finisher
        if: hashFiles('dist/notarize-pending.json') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/macos/publish_notarize_queue.sh dist/notarize-pending.json

      - name: Start the Ubuntu notarization finisher
        if: hashFiles('dist/notarize-pending.json') != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run notarize-finish.yml --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f run_id="${{ github.run_id }}" -f wait_minutes=150 \
            || echo "::warning::Could not dispatch notarize-finish.yml; run it manually to staple."

  windows:
    needs: meta
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'windows'
    name: 'Windows x86_64 CY2025 Release'
    runs-on: windows-2022
    env:
      # Persist sccache in the Actions cache. rv_compiler_cache.cmake uses it
      # as the compiler launcher when sccache is on PATH.
      SCCACHE_GHA_ENABLED: true
    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          ref: ${{ needs.meta.outputs.release_ref }}
          submodules: recursive

      - name: Apply point version from release tag
        if: needs.meta.outputs.publish_release == 'true'
        shell: bash
        run: python scripts/apply_release_version.py "${{ needs.meta.outputs.release_version }}"

      - uses: ./.github/actions/build-windows
        with:
          build-type: 'Release'
          qt-version: '6.5.3'
          python-version: '3.11'
          cmake-version: '3.31.6'
          vfx-platform: 'CY2025'
          msvc-component: '14.40.17.10.x86.x64'
          msvc-compiler: '14.40.33807'
          cache-qt: 'true'
          # Lean Qt set: only modules OpenRV links (skips debug_info + unused kits).
          windows_qt6_modules: 'qt5compat qtimageformats qtmultimedia qtpositioning qtwebchannel qtwebengine qtwebsockets'
          braw-sdk-read-token: ${{ secrets.BRAW_SDK_READ_TOKEN }}
          r3d-sdk-read-token: ${{ secrets.R3D_SDK_READ_TOKEN }}

      - name: Package install tree
        run: |
          7z a -tzip "${{ env.ARTIFACT_WINDOWS }}.zip" ./_install/*
          ls -lh "${{ env.ARTIFACT_WINDOWS }}.zip"
        shell: msys2 {0}

      - name: Build Inno Setup installer
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          $version = "${{ needs.meta.outputs.release_version }}"
          if (-not $version) { $version = "0.0.0" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & $iscc `
            "/DSourceDir=${{ github.workspace }}\_install" `
            "/DAppVersion=$version" `
            "/DOutputDir=${{ github.workspace }}\dist" `
            "/DOutputBaseFilename=${{ env.ARTIFACT_WINDOWS }}-setup" `
            "${{ github.workspace }}\scripts\windows\openrv.iss"
          Get-ChildItem dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_WINDOWS }}
          path: |
            ${{ env.ARTIFACT_WINDOWS }}.zip
            dist/${{ env.ARTIFACT_WINDOWS }}-setup.exe
          if-no-files-found: error
          retention-days: 14

  # ── Publish GitHub Release with stable asset names ────────────────────────
  release:
    name: Publish GitHub Release
    needs: [meta, linux, macos-arm, windows]
    if: >-
      always() &&
      !cancelled() &&
      needs.meta.outputs.publish_release == 'true' &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.macos-arm.result == 'success' || needs.macos-arm.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (
        needs.linux.result == 'success' ||
        needs.macos-arm.result == 'success' ||
        needs.windows.result == 'success'
      ) &&
      needs.linux.result != 'failure' &&
      needs.macos-arm.result != 'failure' &&
      needs.windows.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        shell: bash
        run: |
          set -euo pipefail
          echo "Release assets:"
          ls -lah artifacts/
          # The pending record is an internal queue marker, not a public download.
          find artifacts -name 'notarize-pending.json' -delete
          # Fail if nothing to publish
          test -n "$(find artifacts -type f | head -1)"

      # GitHub's create-release API only accepts a branch name or commit SHA for
      # target_commitish — not a tag name. Auto-tag dispatches with source_ref=vX.Y.Z
      # which previously produced 422 "invalid field target_commitish" and left
      # Releases empty even after all platform builds succeeded.
      - name: Resolve target commitish
        id: target
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.meta.outputs.release_ref }}
        run: |
          set -euo pipefail
          # Resolve branch/tag/sha → commit SHA (API accepts commits/…)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_REF}" --jq .sha)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved target_commitish ${RELEASE_REF} → ${SHA}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ needs.meta.outputs.release_tag }}
          # Tag push: leave empty (existing tag's commit). workflow_dispatch: commit SHA.
          target_commitish: ${{ github.event_name == 'workflow_dispatch' && steps.target.outputs.sha || '' }}
          name: "Open RV ${{ needs.meta.outputs.release_tag }}"
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            Prebuilt **Release** packages (VFX Platform CY2025, Qt 6.5.3, Python 3.11) with `-DRV_ENABLE_ALL_CODECS=ON`.

            Codecs, GPL redistribution terms, and signing secrets are documented in `docs/build_system/release_codecs_and_signing.md`.

            ### Stable download links

            These asset names stay the same across releases so `/releases/latest/download/` URLs keep working:

            | Platform | Install |
            |----------|---------|
            | Linux x86_64 | `openrv-linux-x86_64.tar.gz` |
            | macOS Apple Silicon | `openrv-macos-arm64.dmg` |
            | Windows x64 | `openrv-windows-x86_64-setup.exe` |

            The macOS tarball and Windows zip of the raw install tree are uploaded alongside those installers.

            macOS signing runs only when the Apple secrets are configured. Without them the DMG is unsigned. When they are set, this asset is the signed DMG; Notarize finish staples it onto the same filename after Apple accepts (usually within one 15-minute check).

            Example:
            ```
            https://github.com/${{ github.repository }}/releases/latest/download/openrv-macos-arm64.dmg
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
