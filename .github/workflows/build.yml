# Multi-platform Release builds for Windows, macOS ARM, and Linux.
# Uses prebuilt Qt via jurplel/install-qt-action (aqt) with Actions cache.
#
# Runs on this fork without the AcademySoftwareFoundation owner gate used by ci.yml.
# Trigger: workflow_dispatch (Actions tab) or push to a ci/** branch.

name: Multi-platform Build

on:
  # Manual run from the Actions tab (pick platforms / skip cache).
  workflow_dispatch:
    inputs:
      skip_deps_cache:
        description: 'Skip dependencies caching'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      platforms:
        description: 'Which platforms to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - macos
          - windows

  # Auto-build when pushing CI branches (keeps main free of multi-hour runs).
  push:
    branches:
      - ci/**

concurrency:
  group: multi-platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'linux'
    name: 'Linux Rocky 9 CY2025 Release'
    runs-on: ubuntu-latest
    container:
      image: amd64/rockylinux:9
      volumes:
        - /usr/local/lib/android:/github/home/android
        - /usr/share/dotnet:/github/home/dotnet
        - /opt/ghc:/github/home/ghc
        - /usr/local/.ghcup:/github/home/.ghcup
        - /usr/local/graalvm:/github/home/graalvm
        - /usr/local/share/powershell:/github/home/powershell
        - /usr/local/share/chromium:/github/home/chromium
        - /usr/local/lib/node_modules:/github/home/node_modules
        - /opt/hostedtoolcache:/github/home/hostedtoolcache
        - /usr/local/share/boost:/github/home/boost
        - /usr/share/swift:/github/home/swift
        - /usr/share/miniconda:/github/home/miniconda
        - /usr/local/share/vcpkg:/github/home/vcpkg
        - /home/runner/.cargo:/github/home/.cargo
        - /home/runner/.rustup:/github/home/.rustup
    steps:
      - name: Install git
        run: dnf install -y git
        shell: bash

      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          submodules: recursive

      - uses: ./.github/actions/build-linux
        with:
          rocky-version: '9'
          build-type: 'Release'
          qt-version: '6.5.3'
          cmake-version: '3.31.6'
          python-version: '3.11.8'
          vfx-platform: 'CY2025'
          extra_repo: 'crb'
          cache-qt: 'true'
          # Lean Qt set: only modules OpenRV links (skips debug_info + unused kits).
          rocky_qt6_modules: 'qt5compat qtimageformats qtmultimedia qtpositioning qtwebchannel qtwebengine qtwebsockets'

      - name: Package install tree
        run: |
          tar -czf openrv-linux-x86_64-Release-CY2025.tar.gz -C _install .
          ls -lh openrv-linux-x86_64-Release-CY2025.tar.gz
        shell: bash

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrv-linux-x86_64-Release-CY2025
          path: openrv-linux-x86_64-Release-CY2025.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos-arm:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'macos'
    name: 'macOS ARM64 CY2025 Release'
    runs-on: macos-14
    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          submodules: recursive

      - uses: ./.github/actions/build-macos
        with:
          arch-type: 'arm64'
          build-type: 'Release'
          qt-version: '6.5.3'
          qt-version-short: '6.5'
          python-version: '3.11'
          cmake-version: '3.31.6'
          vfx-platform: 'CY2025'
          skip_deps_cache: ${{ inputs.skip_deps_cache || 'false' }}
          cache-qt: 'true'
          # Lean Qt set: only modules OpenRV links (skips debug_info + unused kits).
          # Qt 6 clang_64 is universal arm64+x86_64 prebuilt — no source build.
          macos_qt6_modules: 'qt5compat qtimageformats qtmultimedia qtpositioning qtwebchannel qtwebengine qtwebsockets'

      - name: Package install tree
        run: |
          tar -czf openrv-macos-arm64-Release-CY2025.tar.gz -C _install .
          ls -lh openrv-macos-arm64-Release-CY2025.tar.gz
        shell: bash

      - name: Upload macOS ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrv-macos-arm64-Release-CY2025
          path: openrv-macos-arm64-Release-CY2025.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platforms == 'all' ||
      inputs.platforms == 'windows'
    name: 'Windows x86_64 CY2025 Release'
    runs-on: windows-2022
    env:
      SCCACHE_GHA_ENABLED: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          submodules: recursive

      - uses: ./.github/actions/build-windows
        with:
          build-type: 'Release'
          qt-version: '6.5.3'
          python-version: '3.11'
          cmake-version: '3.31.6'
          vfx-platform: 'CY2025'
          msvc-component: '14.40.17.10.x86.x64'
          msvc-compiler: '14.40.33807'
          cache-qt: 'true'
          # Lean Qt set: only modules OpenRV links (skips debug_info + unused kits).
          windows_qt6_modules: 'qt5compat qtimageformats qtmultimedia qtpositioning qtwebchannel qtwebengine qtwebsockets'

      - name: Package install tree
        run: |
          7z a -tzip openrv-windows-x86_64-Release-CY2025.zip ./_install/*
          ls -lh openrv-windows-x86_64-Release-CY2025.zip
        shell: msys2 {0}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: openrv-windows-x86_64-Release-CY2025
          path: openrv-windows-x86_64-Release-CY2025.zip
          if-no-files-found: error
          retention-days: 14
