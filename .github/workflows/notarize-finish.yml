# Staple DMGs after Apple notarization, off the macOS runner.
#
# Multi-platform Build submits the signed DMG and exits. Pending submissions
# are assets on the draft release tag `notarize-queue`. This workflow looks at
# that list and returns without calling Apple when it is empty.
#
# Multi-platform Build dispatches this workflow right after it queues a
# submission. One Ubuntu run then polls Apple every few minutes (up to
# wait_minutes) until the queue is empty. No cron at all: if a dispatch is
# ever missed, run this workflow manually (empty inputs = every pending marker).

name: Notarize finish

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: 'Apple notarization submission id (empty = every pending marker)'
        required: false
        type: string
        default: ''
      run_id:
        description: 'GitHub Actions run id that submitted the DMG (empty = every pending marker)'
        required: false
        type: string
        default: ''
      wait_minutes:
        description: 'Keep polling Apple for up to this many minutes while submissions are pending (0 = one pass)'
        required: false
        type: string
        default: '150'

concurrency:
  group: notarize-finish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finish:
    name: Staple accepted DMGs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 1

      - name: Check Apple and staple anything accepted
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          NOTARIZE_SUBMISSION_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.submission_id || '' }}
          NOTARIZE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || '' }}
          WAIT_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_minutes || '0' }}
          POLL_SECONDS: '300'
        run: |
          mkdir -p notarize-out
          deadline=$(( $(date +%s) + ${WAIT_MINUTES:-0} * 60 ))
          while :; do
            rc=0
            python3 scripts/macos/notarize_finish.py finish || rc=$?
            pending=$(gh release view "${NOTARIZE_QUEUE_TAG:-notarize-queue}" --repo "$GITHUB_REPOSITORY" --json assets \
              --jq '[.assets[].name | select(startswith("pending-") and endswith(".json"))] | length' 2>/dev/null || echo 0)
            if [ "$pending" = "0" ] || [ "$(date +%s)" -ge "$deadline" ]; then
              echo "pending markers left: $pending"
              exit $rc
            fi
            echo "$pending submission(s) still pending; next check in ${POLL_SECONDS}s"
            sleep "$POLL_SECONDS"
          done

      - name: Upload stapled DMGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarized-macos-dmg
          path: notarize-out/*.dmg
          if-no-files-found: ignore
          retention-days: 14
