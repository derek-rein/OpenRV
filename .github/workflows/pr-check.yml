# Lightweight PR / main gate for forks (ASWF OpenRV CI is owner-gated and huge).
# Required so release PRs have a status check before merge — same role as
# exr-converter's CI job before Auto-tag / Release.
#
# Full multi-platform binaries build only after merge (see auto-tag-release.yml).

name: PR Check

on:
  push:
    branches: [main]

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read and validate CMakeLists version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(python3 scripts/apply_release_version.py --print)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "CMakeLists version: ${VERSION}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: version must be X.Y.Z" >&2
            exit 1
          fi

      - name: Dry-run apply_release_version round-trip
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          python3 scripts/apply_release_version.py --dry-run "$V"
          python3 scripts/apply_release_version.py --dry-run "v${V}"

      - name: Check release codec preset
        shell: bash
        run: python3 scripts/ci/check_codec_options.py

      - name: Check notarization finisher
        shell: bash
        run: python3 scripts/macos/notarize_finish.py self-check

      - name: Require multi-platform release workflows
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            .github/workflows/build.yml \
            .github/workflows/auto-tag-release.yml \
            .github/workflows/notarize-finish.yml \
            .github/workflows/pr-check.yml \
            scripts/apply_release_version.py \
            scripts/macos/notarize_finish.py
          do
            test -f "$f" || { echo "missing $f" >&2; exit 1; }
            echo "ok $f"
          done

      - name: YAML syntax check (workflows)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "pyyaml"])
              import yaml
          root = pathlib.Path(".github/workflows")
          errors = []
          for path in sorted(root.glob("*.yml")):
              try:
                  yaml.safe_load(path.read_text(encoding="utf-8"))
                  print(f"ok {path}")
              except Exception as e:
                  errors.append(f"{path}: {e}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          PY

  # Aggregate check name for branch protection: "PR Check / pr-ok"
  pr-ok:
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - name: Require validate green
        shell: bash
        run: |
          echo "validate=${{ needs.validate.result }}"
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "PR check failed" >&2
            exit 1
          fi
          echo "PR gate passed"
