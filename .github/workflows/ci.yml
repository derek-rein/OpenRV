name: OpenRV

# Upstream schedules a midnight cron (`0 0 * * *`). On a full matrix that is
# Rocky 8 and 9, macOS x86_64 and arm64, and Windows, Release and Debug, for
# every VFX platform in ci-linux.yml / ci-macos.yml / ci-windows.yml. Jobs are
# also gated on github.repository_owner == AcademySoftwareFoundation, so a cron
# run on this fork would skip and bill nothing, but GitHub would still queue
# the workflow. The cron is removed here. workflow_dispatch remains.
# Push and pull_request jobs stay owner-gated, so this fork does not spend
# minutes on the ASWF matrix.

on:
  push:
    branches:
      # This will run when PR is merged or direct pushes to main.
      - main

  # This allows manual triggering of the workflow from the web
  workflow_dispatch:
    inputs:
      SKIP_DEPS_CACHE:
        description: 'Skip dependencies caching'
        required: true
        default: 'false'

jobs:
  detect-changes:
    if: github.repository_owner == 'AcademySoftwareFoundation'
    runs-on: ubuntu-latest
    outputs:
      cmake_changed: ${{ steps.filter.outputs.cmake }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            cmake:
              - 'cmake/**'
              - '**/CMakeLists.txt'
              - '**/*.cmake'

  linux:
    if: github.repository_owner == 'AcademySoftwareFoundation'
    needs: detect-changes
    uses: ./.github/workflows/ci-linux.yml
    with:
      skip_deps_cache: ${{ inputs.SKIP_DEPS_CACHE || 'false' }}
      full_matrix: ${{ github.event_name != 'pull_request' }}
      run_debug: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake_changed == 'true' }}

  macos:
    if: github.repository_owner == 'AcademySoftwareFoundation'
    needs: detect-changes
    uses: ./.github/workflows/ci-macos.yml
    with:
      skip_deps_cache: ${{ inputs.SKIP_DEPS_CACHE || 'false' }}
      full_matrix: ${{ github.event_name != 'pull_request' }}
      run_debug: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake_changed == 'true' }}

  windows:
    if: github.repository_owner == 'AcademySoftwareFoundation'
    needs: detect-changes
    uses: ./.github/workflows/ci-windows.yml
    with:
      skip_deps_cache: ${{ inputs.SKIP_DEPS_CACHE || 'false' }}
      full_matrix: ${{ github.event_name != 'pull_request' }}
      run_debug: ${{ github.event_name != 'pull_request' || needs.detect-changes.outputs.cmake_changed == 'true' }}